apiVersion: apps/v1
kind: Deployment
metadata:
  name: quakewatch-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quakewatch
  template:
    metadata:
      labels:
        app: quakewatch
    spec:
      containers:
        - name: quakewatch
          image: quakewatch:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: quakewatch-config
                  key: MESSAGE
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: quakewatch-secret
                  key: SECRET_KEY
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
